# Tier 1 — fast validation on every push to every branch.

name: Validate

on:
  push:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/reusable-validate-python.yaml
    permissions:
      contents: read
      pull-requests: read
    with:
      python-version: '3.12.16'
    secrets:
      gitleaks_token: ${{ secrets.GITHUB_TOKEN }}
