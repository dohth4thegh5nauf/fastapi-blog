name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
        # `core`: no extras, admin tests are skipped; `all`: every extra
        extras: ["core", "all"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
    
    - name: Install dependencies (core)
      if: matrix.extras == 'core'
      run: |
        uv pip install --system -e '.[dev]'

    - name: Install dependencies (all extras)
      if: matrix.extras == 'all'
      run: |
        uv pip install --system -e '.[dev,admin,jsonld]'
    
    - name: Lint with ruff
      if: matrix.extras == 'all'
      run: |
        ruff check .
        ruff format . --check
    
    - name: Type check with mypy
      if: matrix.extras == 'all'
      run: |
        mypy .
    
    - name: Test with pytest
      run: |
        coverage run -m pytest .
        coverage report -m
        coverage xml
    
    - name: Upload coverage to Codecov
      if: matrix.extras == 'all'
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
    
    - name: Install dependencies
      run: |
        uv pip install --system -e '.[dev]'
        uv pip install --system safety bandit[toml]
    
    - name: Run safety check
      run: |
        safety check --ignore 70612
    
    - name: Run bandit security check
      run: |
        bandit -r src/ -f json -o bandit-report.json || true
        bandit -r src/
