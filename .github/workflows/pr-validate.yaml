# Tier 1 — repeat the fast validation on the PR merge ref so it can be a
# required check even for pull requests opened from forks.

name: Validate PR

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/reusable-validate-python.yaml
    permissions:
      contents: read
      pull-requests: read
    with:
      python-version: '3.12.16'
    secrets:
      gitleaks_token: ${{ secrets.GITHUB_TOKEN }}

  validate-required:
    name: validate-required
    if: always()
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the fast validation workflow to pass
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATION_RESULT" = success
