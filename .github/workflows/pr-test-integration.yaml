# Tier 2 — integration smoke through the Compose stack: build the image,
# wait for the health probe, then exercise the health endpoints and the
# blog itself over HTTP against the running container.

name: Integration (Compose)

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and start the stack (waits for the health check)
        run: docker compose up -d --wait

      - name: Health probes answer in the health-check format
        run: |
          probe() {
            test "$(curl -fsS "http://localhost:8000$1" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')" = pass
          }
          probe /api/v1/health
          probe /api/v1/health/live
          probe /api/v1/health/ready

      - name: Blog index responds
        run: curl -fsS http://localhost:8000/ > /dev/null

      - name: Tear down the stack
        if: always()
        run: docker compose down -v
