# Keep the contributors list in README.md up to date on pushes to main.

name: Update Contributors

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contributors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Regenerate the contributors list in README
        uses: akhilmhdh/contributors-readme-action@76fb5839a4bd14f33b55809ad9abc8c523e3cc5b # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
