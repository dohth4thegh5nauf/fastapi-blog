# Tier 2 — SAST, SCA, CodeQL and package build before merge.
# Bandit and CodeQL inspect source code; pip-audit checks every runtime extra.

name: Security

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12.16'

      - name: Install locked dependencies
        run: uv sync --frozen --all-extras

      - name: Bandit (SAST)
        run: uvx --from bandit==1.9.4 bandit -r src/ -ll

      - name: pip-audit (SCA) on all locked runtime dependencies
        run: |
          uv export --frozen --all-extras --no-extra dev --no-dev --no-emit-project \
            --output-file /tmp/requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit --requirement /tmp/requirements.txt

      - name: Build the package artifacts
        run: uv build

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8498dc4c2b27cdd99baf0f87955b29ebbf30c78d # v4.39.1
        with:
          languages: python

      - name: Analyze
        uses: github/codeql-action/analyze@8498dc4c2b27cdd99baf0f87955b29ebbf30c78d # v4.39.1

  security-passed:
    name: security-passed
    if: always()
    needs: [scan, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require SAST, SCA, build and CodeQL to pass
        env:
          SCAN_RESULT: ${{ needs.scan.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          test "$SCAN_RESULT" = success
          test "$CODEQL_RESULT" = success
