# Tier 2 — SAST, SCA, CodeQL and package build before merge.
# Bandit and CodeQL inspect source code; pip-audit checks every runtime extra.

name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12.16'

      - name: Install locked dependencies
        run: uv sync --frozen --all-extras

      - name: Bandit (SAST)
        run: uvx --from bandit==1.9.4 bandit -r src/

      - name: pip-audit (SCA) on all locked runtime dependencies
        run: |
          uv export --frozen --all-extras --no-extra dev --no-dev --no-emit-project \
            --output-file /tmp/requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit --requirement /tmp/requirements.txt

      - name: Build the package artifacts
        run: uv build

  codeql:
    if: ${{ !github.event.repository.private || vars.CODEQL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  security-passed:
    name: security-passed
    if: always()
    needs: [scan, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require SAST, SCA, build and CodeQL to pass
        env:
          SCAN_RESULT: ${{ needs.scan.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          CODEQL_EXPECTED: ${{ !github.event.repository.private || vars.CODEQL_ENABLED == 'true' }}
        run: |
          echo "Bandit, dependency audit and build: $SCAN_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "CodeQL: $CODEQL_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$SCAN_RESULT" = success
          if [ "$CODEQL_EXPECTED" = true ]; then
            test "$CODEQL_RESULT" = success
          else
            echo 'CodeQL is disabled by default for private repositories; set CODEQL_ENABLED=true after enabling code scanning.' >> "$GITHUB_STEP_SUMMARY"
            test "$CODEQL_RESULT" = skipped
          fi
