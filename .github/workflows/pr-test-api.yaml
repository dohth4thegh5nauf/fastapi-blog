# Tier 2 — API/contract smoke against the built image using the Compose stack.

name: API Contract

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU for the arm64 build
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1

      - name: Build both supported architectures
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate the Compose model
        run: docker compose config --quiet

      - name: Build and start the API container
        run: docker compose up -d --build --wait --wait-timeout 90

      - name: Resolve the image reference from the Compose model
        id: image
        run: echo "ref=$(docker compose config --images | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Install Trivy from its verified GitHub release
        env:
          TRIVY_VERSION: 0.70.0
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          release_url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            --output "$RUNNER_TEMP/$archive" "$release_url/$archive"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            --output "$RUNNER_TEMP/trivy_checksums.txt" \
            "$release_url/trivy_${TRIVY_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep -F "$archive" trivy_checksums.txt | sha256sum --check)
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/trivy-bin" trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"

      - name: Scan container OS packages with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          version: v0.70.0
          skip-setup-trivy: true
          vuln-type: os
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          timeout: 10m

      - name: Health probes answer in the health-check format
        run: |
          probe() {
            test "$(curl -fsS "http://localhost:8000$1" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')" = pass
          }
          probe /api/v1/health
          probe /api/v1/health/live
          probe /api/v1/health/ready

      - name: Blog index, root redirect and a published post respond
        run: |
          curl -fsS http://localhost:8000/blog/ > /dev/null
          curl -fsS http://localhost:8000/blog/posts/no-tags > /dev/null
          curl -fsS http://localhost:8000/ > /dev/null

      - name: Tear down the stack
        if: always()
        run: docker compose down --volumes --remove-orphans
