# Tier 2 — full unit/integration/API test suite with coverage on every
# supported Python version, with the core install and all optional extras.

name: Test fastapi-blog

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix['python-version'] }}, ${{ matrix.extras }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12.16', '3.13.18']
        extras: [core, all]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix['python-version'] }}

      - name: Install dependencies (core)
        if: matrix.extras == 'core'
        run: |
          uv sync --locked --extra dev
          echo 'UV_EXTRAS=--extra dev' >> "$GITHUB_ENV"

      - name: Install dependencies (all extras)
        if: matrix.extras == 'all'
        run: |
          uv sync --locked --extra dev --extra admin --extra jsonld
          echo 'UV_EXTRAS=--extra dev --extra admin --extra jsonld' >> "$GITHUB_ENV"

      - name: Test with coverage
        run: |
          uv run --locked $UV_EXTRAS coverage run -m pytest
          uv run --locked $UV_EXTRAS coverage report -m
          uv run --locked $UV_EXTRAS coverage xml

      - name: Upload coverage to Codecov
        if: matrix.extras == 'all' && matrix['python-version'] == '3.12.16'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  tests-passed:
    name: tests-passed
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every test matrix leg to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
