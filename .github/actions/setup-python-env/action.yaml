name: Setup Python and uv
description: Install the requested Python version and a pinned uv release with lockfile caching.

inputs:
  python-version:
    description: Python version for this job.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs['python-version'] }}

    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: 0.13.6
        enable-cache: true
        cache-dependency-glob: uv.lock
