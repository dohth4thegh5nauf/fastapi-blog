[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-blog"
version = "0.10.0"
description = "Blogging for FastAPI"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  {name = "Daniel Roy Greenfeld", email = "daniel@feldroy.com"},
]
maintainers = [
  {name = "Daniel Roy Greenfeld", email = "daniel@feldroy.com"},
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Text Processing :: Markup :: Markdown",
]
license-files = ["LICENSE.md"]
dependencies = [
  "fastapi>=0.162.0",
  "jinja2>=3.1.6",
  "jinja2-time>=0.2.0",
  "markdown>=3.11.2",
  "nh3>=0.3.7",
  "pydantic>=2.14.1",
  "pyyaml>=6.0.3",
  "pymdown-extensions>=12.3",
  "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# Admin panel (web UI) and session-based authentication
admin = [
  "starlette-admin[i18n]>=1.0.3",
  "sqlalchemy[asyncio]>=2.1.6",
  "aiosqlite>=0.22.1",
  "itsdangerous>=2.2.0",
  # `passlib` (unmaintained since 2020) is replaced by direct `bcrypt`
  # usage (see `admin/passwords.py`), which lifts the old `bcrypt<4.1` pin
  "bcrypt>=5.0.0",
  "python-multipart>=0.0.32",
]
# JSON-LD expansion and N-Quads output
jsonld = [
  "pyld>=3.3.0",
]
dev = [
  "httpx2>=2.0.0",
  "ruff>=0.17.3",
  "pytest>=9.2.0",
  "coverage>=7.17.0",
  "mypy>=2.4.1",
  "types-Markdown>=3.10.2.20261007",
  "types-PyYAML>=6.0.12.20260906",
]

[project.urls]

bugs = "https://github.com/pydanny/fastapi-blog/issues"
changelog = "https://github.com/pydanny/fastapi-blog/blob/master/CHANGELOG.md"
homepage = "https://github.com/pydanny/fastapi-blog"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"*" = ["*.*"]
"fastapi_blog.translations" = ["*/LC_MESSAGES/*.mo", "*/LC_MESSAGES/*.po"]


# Mypy
# ----

[tool.mypy]
files = "."
exclude = [
  "tests/*",
  "^tmp/",
  "\\+/.*",  # Demo and reference code
  "src/fastapi_blog\\.old/.*",  # Old code (not a valid Python package name)
]

# Use strict defaults
# strict = true
# warn_unreachable = true
# warn_no_return = true



# Ruff config lives in `ruff.toml` at the repo root: a standalone `ruff.toml`
# makes Ruff ignore any `[tool.ruff]` here, so keeping one here too would
# just be dead configuration that looks enforced but isn't.


[tool.pytest.ini_options]
# Scope collection to our own tests: `+/` holds reference material (see
# AGENTS.md) that must stay out of every check, and it isn't even valid
# Python (cookiecutter templates with `{{ }}` placeholders).
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
