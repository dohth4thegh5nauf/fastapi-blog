# Ruff configuration (lint + format). This is the single source of truth:
# keeping a `[tool.ruff]` section in pyproject.toml as well would make one of
# the two silently dead, since Ruff ignores pyproject.toml's `[tool.ruff]`
# whenever a standalone `ruff.toml` is present.

# Basic settings
line-length = 80
indent-width = 2

target-version = 'py312'
exclude = [
  '+/*',  # Demo and reference code
  'AGENTS.md',  # Must not be modified (see the file's own header)
  'tests/examples/posts/**',  # Sample blog post fixtures, not project code
  'tests/examples/pages/**',  # Sample page fixtures, not project code
]
src = ['src']

[lint]
select = [
  'F',   # Pyflakes
  'E',   # Pycodestyle errors
  'W',   # Pycodestyle warnings
  'I',   # isort
  'UP',  # pyupgrade
  'D',   # pydocstyle
]
ignore = [
  'E111',  # Indentation is not a multiple of 4 (project uses 2 spaces)
  'E114',  # Indentation is not a multiple of 4 (comment)
  'E117',  # Over-indented
  'E501',  # Line too long - the formatter takes care of this
  'D100',  # Missing docstring in public module
  'D101',  # Missing docstring in public class
  'D102',  # Missing docstring in public method
  'D103',  # Missing docstring in public function
  'D104',  # Missing docstring in public package
  'D105',  # Missing docstring in magic method
  'D203',  # 1 blank line required before class docstring (conflicts with D211)
  'D213',  # Multi-line docstring summary should start at the second line (conflicts with D212)
]

[lint.per-file-ignores]
# Allow unused imports in __init__ files as these are convenience imports
'**/__init__.py' = ['F401']

[lint.isort]
lines-after-imports = 2
section-order = [
  'future',
  'standard-library',
  'third-party',
  'first-party',
  'project',
  'local-folder',
]

[lint.isort.sections]
project = ['src', 'tests']

[format]
quote-style = 'single'
docstring-code-format = true
docstring-code-line-length = 20
